# 鵲太醫 AI 运营工作台 · Docker Compose 一键编排
# 用法：在仓库根目录执行  docker compose -f docker/docker-compose.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: qty-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 docker/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quetaiyiai}
      MYSQL_USER: ${MYSQL_USER:-quetaiyiai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - qty-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: qty-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Shanghai
      INSTALL_CONFIG_PATH: /app/data/install.json
    volumes:
      - api-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qty-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: qty-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - qty-net

volumes:
  mysql-data:
  api-data:

networks:
  qty-net:
